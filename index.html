<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>POS ค่าเช่าห้อง</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F6F3;--surface:#FFFFFF;--border:#E5E2DB;--border2:#D0CCC3;
  --text:#1A1916;--text2:#6B6760;--text3:#9E9A94;
  --green-bg:#EAF3DE;--green:#27500A;--green-bd:#C0DD97;
  --blue-bg:#E6F1FB;--blue:#0C447C;--blue-bd:#B5D4F4;
  --red-bg:#FCEBEB;--red:#791F1F;--red-bd:#F7C1C1;
  --amber-bg:#FAEEDA;--amber:#633806;--amber-bd:#FAC775;
  --radius:10px;--rsm:7px;
}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.nav-btn{flex:1;padding:10px 4px 8px;font-size:11px;color:var(--text2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;font-family:'Sarabun',sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.page{display:none;flex:1;padding:14px}
.page.active{display:block}
.month-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.month-bar select{flex:1;font-size:14px;font-family:'Sarabun',sans-serif;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--surface);color:var(--text)}
.icon-btn{width:36px;height:36px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
.metric-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.metric-val{font-size:22px;font-weight:600;color:var(--text)}
.metric-val.red{color:var(--red)}.metric-val.green{color:#3B6D11}
.slabel{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:.05em;margin-bottom:8px;margin-top:4px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.badge.cash{background:var(--green-bg);color:var(--green)}
.badge.transfer{background:var(--blue-bg);color:var(--blue)}
.badge.unpaid{background:var(--red-bg);color:var(--red)}
.badge.partial{background:var(--amber-bg);color:var(--amber)}

/* DROPDOWN PANEL */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.panel select{width:100%;font-size:15px;font-family:'Sarabun',sans-serif;font-weight:500;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--bg);color:var(--text);margin-bottom:0}
.panel select:focus{outline:none;border-color:#85B7EB;box-shadow:0 0 0 2px rgba(55,138,221,.15)}
.room-detail{display:none;border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.room-detail.show{display:block}
.rd-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.rd-name{font-size:15px;font-weight:600}
.rd-sub{font-size:13px;color:var(--text2);margin-top:2px}

/* PROGRESS BAR */
.progress-wrap{margin-bottom:12px}
.progress-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:5px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-fill.full{background:#639922}
.progress-fill.partial{background:#BA7517}
.progress-fill.none{background:var(--red)}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.progress-labels span.hi{color:var(--text);font-weight:600}

/* PAYMENT HISTORY */
.pay-history{margin-bottom:12px}
.pay-history-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.pay-history-item:last-child{border-bottom:none}
.pay-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pay-dot.cash{background:#639922}.pay-dot.transfer{background:#378ADD}
.pay-amt{font-weight:600;margin-left:auto}
.pay-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:2px 4px;font-size:16px;line-height:1}

/* PAY BUTTONS */
.pay-option{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:none;font-size:14px;font-family:'Sarabun',sans-serif;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:all .15s;color:var(--text)}
.pay-option:active{transform:scale(0.98)}
.pay-option svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pay-option.sel-cash{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.pay-option.sel-transfer{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue)}
.chk{margin-left:auto;font-size:15px}

/* AMOUNT INPUT */
.amt-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.amt-row label{font-size:13px;color:var(--text2);white-space:nowrap}
.amt-input{flex:1;font-size:15px;font-family:'Sarabun',sans-serif;font-weight:600;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--bg);color:var(--text);text-align:right}
.amt-input:focus{outline:none;border-color:#85B7EB;box-shadow:0 0 0 2px rgba(55,138,221,.15)}
.amt-suffix{font-size:13px;color:var(--text2);white-space:nowrap}
.full-amt-btn{font-size:12px;padding:4px 10px;border:1px solid var(--border2);border-radius:20px;background:none;cursor:pointer;color:var(--text2);font-family:'Sarabun',sans-serif;white-space:nowrap}
.step-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.step-btn{padding:13px 10px;border:1px solid var(--border);border-radius:var(--radius);background:none;font-size:14px;font-family:'Sarabun',sans-serif;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;color:var(--text)}
.step-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.step-btn:active{transform:scale(0.97)}
.step-btn.sel-full{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.step-btn.sel-partial{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber)}
.step-btn.sel-cash{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.step-btn.sel-transfer{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue)}
.step-label{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.change-card{background:var(--green-bg);border:1px solid var(--green-bd);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:none}
.change-card.show{display:block}
.change-card-label{font-size:12px;color:#3B6D11;margin-bottom:4px}
.change-card-val{font-size:26px;font-weight:600;color:var(--green)}

.btn-primary{width:100%;padding:13px;background:var(--text);color:var(--surface);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer}
.btn-danger{width:100%;padding:10px;background:none;border:1px solid var(--red-bd);color:var(--red);border-radius:var(--radius);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:6px}
.btn-ghost{width:100%;padding:8px;background:none;border:none;color:var(--text2);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:2px}

/* ROOM CARDS (summary/alert) */
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:background .1s;user-select:none}
.room-card:active{background:var(--bg)}
.room-num{width:40px;height:40px;border-radius:var(--rsm);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.room-num.cash{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.room-num.transfer{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.room-num.unpaid{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.room-num.partial{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.room-num.empty{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.room-info{flex:1;min-width:0}
.room-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-sub{font-size:12px;color:var(--text2);margin-top:1px}

/* SUMMARY */
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.sum-row span:last-child{font-weight:600}
hr.sdiv{border:none;border-top:1px solid var(--border);margin:6px 0}
.sum-total{font-size:15px;font-weight:600;padding-top:10px!important}
.warn-card{border-left:3px solid var(--red)!important;border-radius:0 var(--radius) var(--radius) 0!important}
.empty-state{text-align:center;padding:2.5rem 1rem}
.empty-state svg{width:40px;height:40px;stroke:var(--green-bd);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 10px;display:block}
.empty-state p{font-size:15px;color:#3B6D11}

/* SETUP */
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.setup-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.setup-label{font-size:12px;color:var(--text2);width:56px;flex-shrink:0;font-weight:500}
.setup-input{flex:1;font-size:14px;font-family:'Sarabun',sans-serif;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--surface);color:var(--text)}
.setup-input:focus{outline:none;border-color:#85B7EB}
.setup-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rl-input{font-size:13px;font-family:'Sarabun',sans-serif;font-weight:600;padding:5px 8px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--surface);color:var(--text);width:64px}
.btn-del{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text3);padding:4px}
.btn-del svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-add{width:100%;padding:10px;border:1px dashed var(--border2);border-radius:var(--radius);background:none;cursor:pointer;font-size:13px;font-family:'Sarabun',sans-serif;color:var(--text2);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-save{width:100%;padding:13px;background:var(--text);color:var(--surface);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:12px}
.save-msg{font-size:13px;color:#3B6D11;text-align:center;margin-top:8px;min-height:18px}

/* DRIVE SECTION */
.drive-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.drive-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.drive-title svg{width:16px;height:16px;flex-shrink:0}
.btn-drive{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500;margin-bottom:7px;transition:background .1s}
.btn-drive:active{background:var(--border)}
.btn-drive svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-drive.primary{background:var(--text);color:var(--surface);border-color:var(--text);margin-bottom:0}
.btn-drive.green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.drive-status{font-size:12px;color:var(--text3);margin-top:7px;line-height:1.5;min-height:16px}
.sync-status{font-size:12px;min-height:16px;padding:6px 10px;border-radius:var(--rsm)}
.sync-status.ok{background:var(--green-bg);color:var(--green)}
.sync-status.err{background:var(--red-bg);color:var(--red)}
.sync-status.warn{background:var(--amber-bg);color:var(--amber)}
.drive-status.ok{color:#3B6D11}.drive-status.err{color:var(--red)}
#file-input{display:none}
.gsi-btn{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text);font-weight:500;margin-bottom:7px}
.gsi-btn svg{width:18px;height:18px;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <button class="nav-btn active" id="nav-home" onclick="showPage('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>หน้าหลัก
    </button>
    <button class="nav-btn" id="nav-summary" onclick="showPage('summary')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>สรุปยอด
    </button>
    <button class="nav-btn" id="nav-alert" onclick="showPage('alert')">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>ค้างจ่าย
    </button>
    <button class="nav-btn" id="nav-setup" onclick="showPage('setup')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>ตั้งค่า
    </button>
  </nav>

  <!-- HOME -->
  <div id="page-home" class="page active">
    <div class="month-bar">
      <button class="icon-btn" onclick="prevMonth()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <select id="month-sel" onchange="onMonthChange('month-sel')"></select>
      <button class="icon-btn" onclick="nextMonth()"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    </div>
    <div class="metrics" id="home-metrics"></div>
    <div class="slabel">บันทึกการจ่าย</div>
    <div class="panel">
      <select id="room-dd" onchange="onRoomSelect()">
        <option value="">— เลือกห้อง —</option>
      </select>
      <div class="room-detail" id="room-detail">
        <div class="rd-header">
          <div><div class="rd-name" id="rd-name"></div><div class="rd-sub" id="rd-sub"></div></div>
          <span class="badge" id="rd-badge"></span>
        </div>
        <!-- progress bar -->
        <div class="progress-wrap" id="rd-progress"></div>
        <!-- payment history -->
        <div class="pay-history" id="rd-history"></div>
        <!-- step 1: full / partial -->
        <div class="step-label">ขั้นที่ 1 — จำนวน</div>
        <div class="step-btns">
          <button class="step-btn" id="stp-full" onclick="rdSelType('full')">
            <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            จ่ายเต็มจำนวน
          </button>
          <button class="step-btn" id="stp-partial" onclick="rdSelType('partial')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            จ่ายบางส่วน
          </button>
        </div>
        <!-- partial amount row -->
        <div id="rd-partial-row" style="display:none">
          <div class="amt-row" style="margin-bottom:10px">
            <label>จำนวน</label>
            <input class="amt-input" type="number" id="rd-amt" min="1" placeholder="0">
            <span class="amt-suffix">บาท</span>
          </div>
        </div>
        <!-- step 2: method -->
        <div id="rd-step2" style="display:none">
          <div class="step-label">ขั้นที่ 2 — วิธีชำระ</div>
          <div class="step-btns">
            <button class="step-btn" id="stp-cash" onclick="rdSelMethod('cash')">
              <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12m-2 0a2 2 0 104 0 2 2 0 10-4 0"/></svg>
              เงินสด
            </button>
            <button class="step-btn" id="stp-tr" onclick="rdSelMethod('transfer')">
              <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
              โอนเงิน
            </button>
          </div>
        </div>
        <!-- step 3: cash change calculator -->
        <div id="rd-step3" style="display:none">
          <div class="step-label">ขั้นที่ 3 — รับเงิน (เฉพาะเงินสด)</div>
          <div class="amt-row" style="margin-bottom:8px">
            <label>รับมา</label>
            <input class="amt-input" type="number" id="rd-received" min="1" placeholder="0" oninput="rdCalcChange()">
            <span class="amt-suffix">บาท</span>
          </div>
          <div class="change-card" id="rd-change-card">
            <div class="change-card-label">ทอนเงิน</div>
            <div class="change-card-val" id="rd-change-val">0 บาท</div>
          </div>
        </div>
        <button class="btn-primary" id="rd-confirm-btn" onclick="rdConfirm()" style="display:none">+ บันทึกการจ่าย</button>
        <button class="btn-danger" id="rd-clr-btn" onclick="rdClearAll()" style="display:none;margin-top:6px">ล้างรายการจ่ายเดือนนี้</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div id="page-summary" class="page">
    <div class="month-bar">
      <button class="icon-btn" onclick="prevMonth()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <select id="month-sel2" onchange="onMonthChange('month-sel2')"></select>
      <button class="icon-btn" onclick="nextMonth()"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    </div>
    <div id="summary-content"></div>
  </div>

  <!-- ALERT -->
  <div id="page-alert" class="page">
    <div class="month-bar">
      <button class="icon-btn" onclick="prevMonth()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <select id="month-sel3" onchange="onMonthChange('month-sel3')"></select>
      <button class="icon-btn" onclick="nextMonth()"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    </div>
    <div id="alert-content"></div>
  </div>

  <!-- SETUP -->
  <div id="page-setup" class="page">
    <div class="slabel" style="margin-top:4px">ข้อมูลห้องเช่า</div>
    <div id="setup-list"></div>
    <button class="btn-add" onclick="addRoom()">
      <svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      เพิ่มห้อง
    </button>
    <button class="btn-save" onclick="saveSetup()">บันทึก</button>
    <p class="save-msg" id="save-msg"></p>

    <div class="drive-section" style="margin-top:16px">
      <div class="drive-title">
        <svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 4h16v16H4z" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
        Google Sheets Sync
      </div>
      <div class="sync-status" id="sync-status" style="margin-bottom:10px"></div>
      <button class="btn-drive green" onclick="loadFromSheets()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        โหลดข้อมูลจาก Sheets
      </button>
      <button class="btn-drive" style="margin-top:7px" onclick="save()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        บันทึกขึ้น Sheets ตอนนี้
      </button>
    </div>
    <div class="drive-section">
      <div class="drive-title">
        <svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV (สำรองข้อมูล)
      </div>
      <button class="btn-drive primary" onclick="exportCSV()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        download CSV รายเดือนนี้
      </button>
    </div>
    <div class="drive-section">
      <div class="drive-title">
        <svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import CSV
      </div>
      <button class="btn-drive" onclick="document.getElementById('file-input').click()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        เลือกไฟล์ CSV
      </button>
      <input type="file" id="file-input" accept=".csv" onchange="importCSV(event)">
    </div>
  </div>
</div>

<script>
const MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const now=new Date();
let curY=now.getFullYear(),curM=now.getMonth();

const DEFAULT_ROOMS=[
  {id:1,name:'101',tenant:'คุณสมศรี',rent:5000},
  {id:2,name:'102',tenant:'คุณวิชัย',rent:5000},
  {id:3,name:'103',tenant:'คุณมาลี',rent:5500},
  {id:4,name:'104',tenant:'คุณประสิทธิ์',rent:5000},
  {id:5,name:'105',tenant:'คุณนิตยา',rent:6000},
  {id:6,name:'201',tenant:'คุณอรทัย',rent:5000},
  {id:7,name:'202',tenant:'',rent:5000},
  {id:8,name:'203',tenant:'คุณสุชาติ',rent:5500},
  {id:9,name:'204',tenant:'คุณเพ็ญพรรณ',rent:5000},
  {id:10,name:'205',tenant:'คุณธนพล',rent:6000},
];

// iOS-safe local cache
let _mem={};
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return _mem[k]||null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){_mem[k]=v;}},
};

const API_URL='https://script.google.com/macros/s/AKfycbxfYYtLi-ELZCXDaLaJf1hYUIjdFIfC0RD3wK6ucTbfmUNCE3Cv-SdkPZVUPiw6BhVK/exec';
let rooms=JSON.parse(store.get('pos_rooms')||'null')||JSON.parse(JSON.stringify(DEFAULT_ROOMS));
let payments=JSON.parse(store.get('pos_payments2')||'{}');
let _saving=false;

function paymentsToFlat(){
  const rows=[];
  Object.keys(payments).forEach(mk=>{
    Object.keys(payments[mk]||{}).forEach(rid=>{
      (payments[mk][rid]||[]).forEach(e=>{
        rows.push({monthKey:mk,roomId:+rid,method:e.method,amount:e.amount,date:e.date||''});
      });
    });
  });
  return rows;
}

function paymentsFromFlat(rows){
  const p={};
  rows.forEach(r=>{
    const mk=String(r.monthKey);const rid=String(r.roomId);
    if(!p[mk])p[mk]={};
    if(!p[mk][rid])p[mk][rid]=[];
    p[mk][rid].push({method:r.method,amount:+r.amount,date:r.date||''});
  });
  return p;
}

function saveLocal(){
  store.set('pos_rooms',JSON.stringify(rooms));
  store.set('pos_payments2',JSON.stringify(payments));
}

async function save(){
  saveLocal();
  if(_saving)return;
  _saving=true;
  setSyncStatus('กำลังบันทึก...','');
  try{
    const res=await fetch(API_URL,{
      method:'POST',
      body:JSON.stringify({action:'save',rooms:rooms,payments:paymentsToFlat()})
    });
    const data=await res.json();
    if(data.ok)setSyncStatus('บันทึกแล้ว ✓','ok');
    else setSyncStatus('เกิดข้อผิดพลาด','err');
  }catch(err){
    setSyncStatus('offline — บันทึกเฉพาะเครื่อง','warn');
  }
  _saving=false;
}

async function loadFromSheets(){
  setSyncStatus('กำลังโหลดข้อมูล...','');
  try{
    const res=await fetch(API_URL+'?action=load');
    const data=await res.json();
    if(data.rooms&&data.rooms.length){
      rooms=data.rooms.map(r=>({...r,id:+r.id,rent:+r.rent}));
      store.set('pos_rooms',JSON.stringify(rooms));
    }
    if(data.payments){
      payments=paymentsFromFlat(data.payments);
      store.set('pos_payments2',JSON.stringify(payments));
    }
    setSyncStatus('โหลดสำเร็จ ✓','ok');
    renderAll();renderSetup();
  }catch(err){
    setSyncStatus('โหลดไม่ได้ — ใช้ข้อมูลในเครื่อง','warn');
  }
}

function setSyncStatus(msg,cls){
  const el=document.getElementById('sync-status');
  if(!el)return;
  el.textContent=msg;
  el.className='sync-status '+(cls||'');
}
function mkey(y,m){return y+'-'+(m+1).toString().padStart(2,'0')}
function getEntries(id,y,m){return((payments[mkey(y,m)]||{})[id])||[]}
function getPaidAmt(id,y,m){return getEntries(id,y,m).reduce((s,e)=>s+e.amount,0)}
function getStatus(id,y,m,rent){
  const entries=getEntries(id,y,m);
  if(!entries.length)return'unpaid';
  const paid=entries.reduce((s,e)=>s+e.amount,0);
  return paid>=rent?'paid':'partial';
}
function getStatusMethod(id,y,m){
  // last payment method
  const e=getEntries(id,y,m);
  if(!e.length)return null;
  return e[e.length-1].method;
}
function fmt(n){return Number(n).toLocaleString('th-TH')}

function addEntry(id,y,m,method,amount){
  const k=mkey(y,m);
  if(!payments[k])payments[k]={};
  if(!payments[k][id])payments[k][id]=[];
  payments[k][id].push({method,amount,date:new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'})});
  save();
}
function removeEntry(id,y,m,idx){
  const k=mkey(y,m);
  if(payments[k]&&payments[k][id]){
    payments[k][id].splice(idx,1);
    if(!payments[k][id].length)delete payments[k][id];
  }
  save();
}
function clearEntries(id,y,m){
  const k=mkey(y,m);
  if(payments[k])delete payments[k][id];
  save();
}

/* MONTH SELECTORS */
function populateSels(){
  const opts=[];
  for(let i=6;i>=-6;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    opts.push({y:d.getFullYear(),m:d.getMonth(),label:MONTHS[d.getMonth()]+' '+(d.getFullYear()+543)});
  }
  ['month-sel','month-sel2','month-sel3'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.innerHTML=opts.map(o=>`<option value="${o.y}-${o.m}"${o.y===curY&&o.m===curM?' selected':''}>${o.label}</option>`).join('');
  });
}
function onMonthChange(id){
  const[y,m]=document.getElementById(id).value.split('-');
  curY=+y;curM=+m;populateSels();renderAll();
}
function prevMonth(){curM--;if(curM<0){curM=11;curY--;}populateSels();renderAll();}
function nextMonth(){curM++;if(curM>11){curM=0;curY++;}populateSels();renderAll();}

/* HOME */
let _rdMethod=null,_rdType=null;
function renderHome(){
  const active=rooms.filter(r=>r.tenant);
  let cashAmt=0,trAmt=0,fullPaid=0,partial=0,unpaid=0;
  active.forEach(r=>{
    const st=getStatus(r.id,curY,curM,totalRent(r));
    const entries=getEntries(r.id,curY,curM);
    entries.forEach(e=>{
      if(e.method==='cash')cashAmt+=e.amount;
      else trAmt+=e.amount;
    });
    if(st==='paid')fullPaid++;
    else if(st==='partial')partial++;
    else unpaid++;
  });
  document.getElementById('home-metrics').innerHTML=`
    <div class="metric"><div class="metric-label">จ่ายครบ</div><div class="metric-val green">${fullPaid}/${active.length}</div></div>
    <div class="metric"><div class="metric-label">ค้าง/บางส่วน</div><div class="metric-val ${unpaid+partial>0?'red':''}">${unpaid+partial} ห้อง</div></div>
    <div class="metric"><div class="metric-label">ยอดเงินสด</div><div class="metric-val">${fmt(cashAmt)}</div></div>
    <div class="metric"><div class="metric-label">ยอดโอน</div><div class="metric-val">${fmt(trAmt)}</div></div>`;

  // Rebuild dropdown
  const dd=document.getElementById('room-dd');
  const prev=dd.value;
  dd.innerHTML='<option value="">— เลือกห้อง —</option>'+rooms.map(r=>{
    if(!r.tenant)return`<option value="${r.id}">⚪ ${r.name}  (ว่าง)</option>`;
    const st=getStatus(r.id,curY,curM,totalRent(r));
    const icon=st==='paid'?'🟢':st==='partial'?'🟠':'🔴';
    const tag=st==='paid'?'จ่ายครบ':st==='partial'?'จ่ายบางส่วน':'ค้างจ่าย';
    return`<option value="${r.id}">${icon} ${r.name}  (${tag})</option>`;
  }).join('');
  if(prev){dd.value=prev;renderRoomDetail(+prev);}
}

function onRoomSelect(){
  const id=+document.getElementById('room-dd').value;
  _rdMethod=null;_rdType=null;
  if(!id){document.getElementById('room-detail').classList.remove('show');return;}
  renderRoomDetail(id);
}

function renderRoomDetail(id){
  const r=rooms.find(x=>x.id===id);
  if(!r||!r.tenant){document.getElementById('room-detail').classList.remove('show');return;}
  const entries=getEntries(id,curY,curM);
  const paid=entries.reduce((s,e)=>s+e.amount,0);
  const remaining=Math.max(0,totalRent(r)-paid);
  const st=getStatus(id,curY,curM,totalRent(r));

  const FMONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  document.getElementById('rd-name').textContent='ห้อง '+r.name+' — '+r.tenant;
  document.getElementById('rd-sub').innerHTML=FMONTHS[curM]+' '+(curY+543)+'<br>รวมสุทธิ '+fmt(totalRent(r))+' บาท';

  const bdg=document.getElementById('rd-badge');
  if(st==='paid'){bdg.textContent='ครบแล้ว';bdg.className='badge cash';}
  else if(st==='partial'){bdg.textContent='จ่ายบางส่วน';bdg.className='badge partial';}
  else{bdg.textContent='ค้างจ่าย';bdg.className='badge unpaid';}

  // Progress bar
  const pct=Math.min(100,Math.round(paid/totalRent(r)*100));
  const fillCls=st==='paid'?'full':st==='partial'?'partial':'none';
  document.getElementById('rd-progress').innerHTML=paid>0?`
    <div class="progress-bar"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>
    <div class="progress-labels"><span>จ่ายแล้ว <span class="hi">${fmt(paid)} บาท</span></span><span>คงเหลือ <span class="hi">${fmt(remaining)} บาท</span></span></div>
  `:'';

  // History
  let histHtml='';
  if(entries.length){
    histHtml=entries.map((e,i)=>`
      <div class="pay-history-item">
        <div class="pay-dot ${e.method}"></div>
        <span>${e.method==='cash'?'เงินสด':'โอน'}</span>
        <span style="color:var(--text3);font-size:12px">${e.date||''}</span>
        <span class="pay-amt">${fmt(e.amount)} บาท</span>
        <button class="pay-del" onclick="rdDelEntry(${id},${i})" title="ลบรายการนี้">×</button>
      </div>`).join('');
  }
  document.getElementById('rd-history').innerHTML=histHtml;

  // Step 1 buttons
  document.getElementById('stp-full').className='step-btn'+(_rdType==='full'?' sel-full':'');
  document.getElementById('stp-partial').className='step-btn'+(_rdType==='partial'?' sel-partial':'');
  // partial amount row
  const partRow=document.getElementById('rd-partial-row');
  partRow.style.display=_rdType==='partial'?'block':'none';
  if(_rdType==='full'){
    document.getElementById('rd-amt').value=remaining>0?remaining:'';
  } else if(_rdType==='partial'){
    const amtEl=document.getElementById('rd-amt');
    if(!amtEl.value||+amtEl.value===0)amtEl.value='';
  }
  // Step 2 (method) — show only after type chosen
  const step2=document.getElementById('rd-step2');
  step2.style.display=_rdType?'block':'none';
  document.getElementById('stp-cash').className='step-btn'+(_rdMethod==='cash'?' sel-cash':'');
  document.getElementById('stp-tr').className='step-btn'+(_rdMethod==='transfer'?' sel-transfer':'');
  // Step 3 (cash change) — show only if method=cash
  const step3=document.getElementById('rd-step3');
  step3.style.display=(_rdMethod==='cash'&&_rdType)?'block':'none';
  // Confirm button
  document.getElementById('rd-confirm-btn').style.display=(_rdType&&_rdMethod)?'block':'none';
  document.getElementById('rd-clr-btn').style.display=entries.length?'block':'none';
  document.getElementById('room-detail').classList.add('show');
}

function rdSelType(t){
  _rdType=t;_rdMethod=null;
  const id=+document.getElementById('room-dd').value;if(id)renderRoomDetail(id);
}
function rdSelMethod(v){
  _rdMethod=v;
  // reset change calc
  document.getElementById('rd-received').value='';
  document.getElementById('rd-change-card').classList.remove('show');
  const id=+document.getElementById('room-dd').value;if(id)renderRoomDetail(id);
}
function rdCalcChange(){
  const id=+document.getElementById('room-dd').value;if(!id)return;
  const amt=+document.getElementById('rd-amt').value;
  const received=+document.getElementById('rd-received').value;
  const card=document.getElementById('rd-change-card');
  const valEl=document.getElementById('rd-change-val');
  if(received>0&&amt>0){
    const change=received-amt;
    valEl.textContent=(change>=0?fmt(change):'ไม่พอ — ขาด '+fmt(Math.abs(change)))+' บาท';
    valEl.style.color=change>=0?'var(--green)':'var(--red)';
    card.classList.add('show');
  } else {
    card.classList.remove('show');
  }
}
function rdConfirm(){
  const id=+document.getElementById('room-dd').value;
  if(!id||!_rdType||!_rdMethod){alert('กรุณาเลือกให้ครบทุกขั้นตอน');return;}
  const amt=+document.getElementById('rd-amt').value;
  if(!amt||amt<=0){alert('กรุณาระบุจำนวนเงิน');return;}
  if(_rdMethod==='cash'){
    const received=+document.getElementById('rd-received').value;
    if(received>0&&received<amt){
      alert('เงินที่รับมาไม่พอ — กรุณาตรวจสอบ');return;
    }
  }
  addEntry(id,curY,curM,_rdMethod,amt);
  document.getElementById('rd-amt').value='';
  document.getElementById('rd-received').value='';
  document.getElementById('rd-change-card').classList.remove('show');
  _rdMethod=null;_rdType=null;
  renderAll();
  const btn=document.getElementById('rd-confirm-btn');
  const orig=btn.textContent;btn.textContent='✓ บันทึกแล้ว';
  setTimeout(()=>{btn.textContent=orig;},1200);
}
function rdDelEntry(id,idx){
  if(!confirm('ลบรายการนี้?'))return;
  removeEntry(id,curY,curM,idx);
  renderRoomDetail(id);renderHome();renderSummary();renderAlert();
}
function rdClearAll(){
  if(!confirm('ล้างรายการจ่ายทั้งหมดของห้องนี้เดือนนี้?'))return;
  const id=+document.getElementById('room-dd').value;
  clearEntries(id,curY,curM);_rdMethod=null;_rdType=null;
  renderAll();
}

/* SUMMARY */
function roomStatusClass(r,y,m){
  const st=getStatus(r.id,y,m,r.rent);
  if(st==='paid'){const lm=getStatusMethod(r.id,y,m);return lm==='cash'?'cash':'transfer';}
  return st==='partial'?'partial':'unpaid';
}
function renderSummary(){
  const active=rooms.filter(r=>r.tenant);
  let fullPaid=[],partial=[],unpaid=[];
  active.forEach(r=>{
    const st=getStatus(r.id,curY,curM,totalRent(r));
    if(st==='paid')fullPaid.push(r);
    else if(st==='partial')partial.push(r);
    else unpaid.push(r);
  });

  const mkCard=(r,warnColor)=>{
    const cls=roomStatusClass(r,curY,curM);
    const st=getStatus(r.id,curY,curM,totalRent(r));
    const paid=getPaidAmt(r.id,curY,curM);
    const entries=getEntries(r.id,curY,curM);
    const entrySub=entries.length?entries.map(e=>`${e.method==='cash'?'สด':'โอน'} ${fmt(e.amount)}`).join(' · '):'';
    const bl=st==='paid'?'ครบ':st==='partial'?`${fmt(paid)}/${fmt(totalRent(r))}`:'ค้าง';
    const badgeCls=st==='paid'?(cls==='cash'?'cash':'transfer'):st==='partial'?'partial':'unpaid';
    const borderStyle=warnColor==='amber'?'border-left-color:var(--amber)!important':'';
    return`<div class="room-card${warnColor?' warn-card':''}" style="${borderStyle}" onclick="jumpToRoom(${r.id})">
      <div class="room-num ${cls}">${r.name}</div>
      <div class="room-info">
        <div class="room-name">${r.tenant}</div>
        <div class="room-sub">${entrySub||fmt(r.rent)+' บาท/เดือน'}</div>
      </div>
      <span class="badge ${badgeCls}">${bl}</span>
    </div>`;
  };

  let html='';
  if(partial.length){html+=`<div class="slabel">จ่ายบางส่วน</div>`;partial.forEach(r=>{html+=mkCard(r,'amber');});}
  if(fullPaid.length){html+=`<div class="slabel"${partial.length?' style="margin-top:10px"':''}>จ่ายครบ</div>`;fullPaid.forEach(r=>{html+=mkCard(r,false);});}
  if(!active.length)html='<div class="empty-state"><p style="color:var(--text2)">ยังไม่มีห้องเช่า</p></div>';
  document.getElementById('summary-content').innerHTML=html;
}

/* ALERT */
function renderAlert(){
  const active=rooms.filter(r=>r.tenant);
  const pending=active.filter(r=>getStatus(r.id,curY,curM,r.rent)!=='paid');
  if(!pending.length){
    document.getElementById('alert-content').innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <p>ทุกห้องจ่ายครบแล้ว! 🎉</p></div>`;
    return;
  }
  const unpaid=pending.filter(r=>getStatus(r.id,curY,curM,r.rent)==='unpaid');
  const partial=pending.filter(r=>getStatus(r.id,curY,curM,r.rent)==='partial');
  const totalOut=pending.reduce((s,r)=>s+(r.rent-getPaidAmt(r.id,curY,curM)),0);
  let html=`<div style="font-size:13px;color:var(--red);margin-bottom:10px;font-weight:500">⚠️ ค้างอยู่ ${pending.length} ห้อง รวม ${fmt(totalOut)} บาท</div>`;
  if(partial.length){
    html+=`<div class="slabel">จ่ายบางส่วน</div>`;
    partial.forEach(r=>{
      const paid=getPaidAmt(r.id,curY,curM);
      html+=`<div class="room-card warn-card" style="border-left-color:var(--amber)!important" onclick="jumpToRoom(${r.id})">
        <div class="room-num partial">${r.name}</div>
        <div class="room-info"><div class="room-name">${r.tenant}</div><div class="room-sub">จ่าย ${fmt(paid)} / ${fmt(totalRent(r))} บาท — ค้าง ${fmt(totalRent(r)-paid)} บาท</div></div>
        <span class="badge partial">บางส่วน</span></div>`;
    });
  }
  if(unpaid.length){
    html+=`<div class="slabel" style="margin-top:${partial.length?10:0}px">ยังไม่จ่ายเลย</div>`;
    unpaid.forEach(r=>{
      html+=`<div class="room-card warn-card" onclick="jumpToRoom(${r.id})">
        <div class="room-num unpaid">${r.name}</div>
        <div class="room-info"><div class="room-name">${r.tenant}</div><div class="room-sub">${fmt(r.rent)} บาท/เดือน</div></div>
        <span class="badge unpaid">แตะบันทึก</span></div>`;
    });
  }
  document.getElementById('alert-content').innerHTML=html;
}

function jumpToRoom(id){
  showPage('home');
  const dd=document.getElementById('room-dd');
  dd.value=id;_rdMethod=null;_rdType=null;
  document.getElementById('rd-amt').value='';
  renderRoomDetail(id);
}

/* SETUP */

        </button>
      </div>
      <div class="setup-row"><label class="setup-label">ผู้เช่า</label><input class="setup-input" id="st-${i}" value="${r.tenant}" placeholder="ชื่อผู้เช่า"></div>
      <div class="setup-row"><label class="setup-label">ค่าเช่า</label><input class="setup-input" id="sr-${i}" type="number" value="${r.rent||0}" oninput="updateTotal(${i})" placeholder="0"></div>
      <div class="setup-row"><label class="setup-label">อื่นๆ</label><input class="setup-input" id="sother-${i}" type="number" value="${r.other||0}" oninput="updateTotal(${i})" placeholder="0"></div>
      <div class="setup-row"><label class="setup-label">จอดรถ</label><input class="setup-input" id="spark-${i}" type="number" value="${r.parking||0}" oninput="updateTotal(${i})" placeholder="0"></div>
      <div class="setup-row"><label class="setup-label">ค่าน้ำ</label><input class="setup-input" id="swater-${i}" type="number" value="${r.water||0}" oninput="updateTotal(${i})" placeholder="0"></div>
      <div class="setup-row"><label class="setup-label">ค่าไฟ</label><input class="setup-input" id="selec-${i}" type="number" value="${r.electric||0}" oninput="updateTotal(${i})" placeholder="0"></div>
      <div class="setup-row"><label class="setup-label">ค่าขยะ</label><input class="setup-input" id="strash-${i}" type="number" value="${r.trash||0}" oninput="updateTotal(${i})" placeholder="0"></div>
      <div class="setup-row" style="background:var(--bg);border-radius:var(--rsm);padding:6px 8px;margin-top:2px">
        <label class="setup-label" style="font-weight:600;color:var(--text)">รวมสุทธิ</label>
        <span id="stotal-${i}" style="font-size:15px;font-weight:600;color:var(--text)">${fmt((r.rent||0)+(r.other||0)+(r.parking||0)+(r.water||0)+(r.electric||0)+(r.trash||0))} บาท</span>
      </div>
      <div class="setup-row"><label class="setup-label">หมายเหตุ</label><input class="setup-input" id="snt-${i}" value="${r.note||''}" placeholder="เพิ่มเติม..."></div>
    </div>`).join('');
}
function addRoom(){rooms.push({id:Date.now(),name:''+(rooms.length+101),tenant:'',rent:5000,other:0,parking:0,water:0,electric:0,trash:0,note:''});renderSetup();}
function updateTotal(i){
  const fields=['sr','sother','spark','swater','selec','strash'];
  const total=fields.reduce((s,f)=>s+(+document.getElementById(f+'-'+i).value||0),0);
  document.getElementById('stotal-'+i).textContent=fmt(total)+' บาท';
}
function totalRent(r){return(+r.rent||0)+(+r.other||0)+(+r.parking||0)+(+r.water||0)+(+r.electric||0)+(+r.trash||0);}
function removeRoom(i){rooms.splice(i,1);renderSetup();}
function saveSetup(){
  rooms.forEach((r,i)=>{
    r.name=document.getElementById('sn-'+i).value||r.name;
    r.tenant=document.getElementById('st-'+i).value;
    r.rent=+document.getElementById('sr-'+i).value||0;
    r.other=+document.getElementById('sother-'+i).value||0;
    r.parking=+document.getElementById('spark-'+i).value||0;
    r.water=+document.getElementById('swater-'+i).value||0;
    r.electric=+document.getElementById('selec-'+i).value||0;
    r.trash=+document.getElementById('strash-'+i).value||0;
    r.note=document.getElementById('snt-'+i).value;
  });
  save();
  document.getElementById('save-msg').textContent='✓ บันทึกแล้ว';
  setTimeout(()=>document.getElementById('save-msg').textContent='',2000);
  renderAll();
}

/* EXPORT CSV */
function paymentsToCSV(){
  let csv='\uFEFFห้อง,ผู้เช่า,ค่าเช่า,วิธีชำระ,จำนวน,วันที่,เดือน\n';
  Object.keys(payments).forEach(mk=>{
    const[y,m1]=mk.split('-');const m=+m1-1;
    const label=MONTHS[m]+(+y+543);
    Object.keys(payments[mk]).forEach(rid=>{
      const room=rooms.find(r=>r.id==rid);
      if(!room)return;
      (payments[mk][rid]||[]).forEach(e=>{
        csv+=`${room.name},${room.tenant},${room.rent},${e.method==='cash'?'เงินสด':'โอน'},${e.amount},${e.date||''},${label}\n`;
      });
    });
  });
  return csv;
}
function exportCSV(){
  const label=MONTHS[curM]+(curY+543);
  let csv='\uFEFFห้อง,ผู้เช่า,ค่าเช่า,วิธีชำระ,จำนวน,วันที่,เดือน\n';
  rooms.filter(r=>r.tenant).forEach(r=>{
    const entries=getEntries(r.id,curY,curM);
    if(entries.length){
      entries.forEach(e=>{
        csv+=`${r.name},${r.tenant},${r.rent},${e.method==='cash'?'เงินสด':'โอน'},${e.amount},${e.date||''},${label}\n`;
      });
    } else {
      csv+=`${r.name},${r.tenant},${r.rent},ยังไม่จ่าย,0,,${label}\n`;
    }
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`ค่าเช่า_${label}.csv`;a.click();
}

/* IMPORT CSV */
function importCSV(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(lines.length<2){alert('ไฟล์ CSV ไม่ถูกต้อง');return;}
    let imported=0,skipped=0;
    lines.slice(1).forEach(line=>{
      const cols=line.split(',');if(cols.length<5)return;
      const[rname,,, method,amtStr,,monthStr]=cols.map(c=>c.trim());
      const room=rooms.find(r=>r.name===rname);if(!room){skipped++;return;}
      if(method==='ยังไม่จ่าย'){imported++;return;}
      const amt=+amtStr;if(!amt)return;
      let ty=curY,tm=curM;
      if(monthStr){
        const mi=MONTHS.findIndex(x=>monthStr.startsWith(x));
        if(mi>=0){tm=mi;const ys=monthStr.slice(MONTHS[mi].length);if(ys&&!isNaN(+ys))ty=+ys-543;}
      }
      const m=method==='เงินสด'?'cash':'transfer';
      addEntry(room.id,ty,tm,m,amt);imported++;
    });
    event.target.value='';renderAll();
    alert(`นำเข้าสำเร็จ ${imported} รายการ${skipped?`\nข้าม ${skipped} (ไม่พบห้อง)`:''}`)
  };
  reader.readAsText(file,'UTF-8');
}
